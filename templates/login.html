<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Messenger - Registrierung</title>
    <link rel="stylesheet" href="/static/style/variables.css">
    <link rel="stylesheet" href="/static/style/layout.css">
    <link rel="stylesheet" href="/static/style/login.css">
</head>
<body>

<div class="containerRegister" id="containerRegister">
                <div class="containerRegister-inner">

                    <h2>Neuen Benutzer erstellen</h2>

                    <input
                        type="text"
                        id="username"
                        placeholder="Bitte Nutzernamen eingeben"
                        maxlength="50">


                    <input 
                        type="password"
                        id="password"
                        placeholder="Bitte Password eingeben"
                        maxlength="50"
                    >


                    <div class="containerRegister-buttons">
                        <button id="submitRegister">Erstellen</button>
                    </div>
                    <a href="/" class="backButton">
                        Zum Messenger
                    </a>

                </div>
            </div>




<script src="/static/javascript/register.js"></script>

</body>
</html>
